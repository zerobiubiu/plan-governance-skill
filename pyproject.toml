[project]
name = "plan-governance-skill"
version = "0.1.0"
description = "策略驱动的 Plan 编译、验证、调度、第三方审查、模拟与治理 Skill"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "zerobiubiu" }]
keywords = ["plan", "governance", "agent", "skill", "validation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/zerobiubiu/plan-governance-skill"
Repository = "https://github.com/zerobiubiu/plan-governance-skill"

# 零第三方运行时依赖：脚本全部使用 Python 3.11+ 标准库。
# 运行：uv run python scripts/self_check.py
